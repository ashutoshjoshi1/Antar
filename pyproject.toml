[project]
name = "antar"
version = "0.1.0"
description = "Multimodal AI model optimization, benchmarking, and cloud-to-edge deployment platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antar contributors" }]
keywords = ["ai", "optimization", "quantization", "benchmarking", "edge", "amd", "lemonade", "rocm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The base install is deliberately light: it runs the API, CLI, hardware
# detection, and the mock/Lemonade adapters on any platform, with no GPU stack.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psutil>=5.9",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.6",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Training / optimization stack. Not needed to run the API or dashboard.
# On an AMD ROCm host, install the ROCm build of torch first — see
# docs/installation/amd-cloud.md. Never add ROCm wheels to the base install.
ml = [
    "peft>=0.12",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.scripts]
antar = "antar_cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["antar", "apps/api/antar_api", "apps/cli/antar_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "ASYNC", "S"]
ignore = [
    "S603", # subprocess calls use fixed argument lists, never a shell
]

[tool.ruff.lint.per-file-ignores]
# ASYNC110: tests poll a fake backend for a few event-loop turns; an Event would add noise.
"tests/**" = ["S101", "S105", "S106", "ASYNC110"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call expressions in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["antar", "apps/api/antar_api", "apps/cli/antar_cli", "tests", "examples"]
mypy_path = ["apps/api", "apps/cli"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not lemonade_live and not amd_live'"
markers = [
    "lemonade_live: needs a running Lemonade server with models; run with -m lemonade_live",
    "amd_live: needs a running vLLM endpoint on an AMD GPU host; run with -m amd_live",
]

[tool.coverage.run]
source = ["antar", "antar_api", "antar_cli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
