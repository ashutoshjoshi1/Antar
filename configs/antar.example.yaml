# Antar configuration. Copy to configs/antar.yaml (git-ignored) and edit.
# Every key can also be set by environment variable, e.g.
#   ANTAR_LEMONADE__BASE_URL=http://localhost:13305/v1
# Secrets (ANTAR_LEMONADE__API_KEY) belong in the environment or .env, not here.

enable_mock_backend: true

lemonade:
  # Lemonade's documented default. Include the /v1 prefix.
  base_url: http://localhost:13305/v1
  timeout_seconds: 3.0             # connecting, and short calls such as health
  generation_timeout_seconds: 300  # longest silence tolerated during generation
  load_timeout_seconds: 600

max_image_bytes: 8388608           # per uploaded image

storage:
  models_dir: data/models
  artifacts_dir: data/artifacts
  training_dir: data/training
  benchmarks_dir: data/benchmarks
  experiments_dir: data/experiments

  comparisons_dir: data/comparisons
  cloud_dir: data/cloud

# Optional. The SSH host of an AMD GPU machine you provisioned yourself. Used only for
# read-only checks (preflight, amd-smi). See configs/hardware/amd-cloud.example.yaml.
# amd_cloud:
#   name: my-amd-host
#   ssh_host: gpu.example.com      # or an alias from ~/.ssh/config
#   ssh_user: ubuntu
#   gpu_poll_interval_seconds: 10

# Optional. The vLLM endpoint for cloud inference: the near end of an SSH tunnel.
# The API key belongs in the environment (ANTAR_CLOUD__API_KEY), not here.
# cloud:
#   base_url: http://127.0.0.1:18000/v1
#   vllm_image: vllm/vllm-openai-rocm:v0.34.0-rocm100
#   models:                        # only needed for models outside Antar's catalog
#     - id: my-served-name
#       source: Org/Model
#       modalities: [text, vision]

# cloud_cost:
#   hourly_price_usd: 0            # what your provider charges; Antar cannot look it up
#   credit_balance_usd: 0
#   max_experiment_minutes: 30
