name: Bug report
description: Something in Antar behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config (with secrets removed), and any error output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `uv run antar system` and `uv run antar backends`. Include your Lemonade version if relevant.
      render: text
    validations:
      required: true
